<div class="np-coquille">
  <header class="np-entete-application">
    <button
      type="button"
      class="np-menu-bascule"
      (click)="basculerMenu()"
      [attr.aria-expanded]="menuOuvert"
      aria-controls="np-navigation"
      aria-label="Menu de navigation"
    >
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
        focusable="false"
      >
        <line x1="4" y1="6" x2="20" y2="6"></line>
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="18" x2="20" y2="18"></line>
      </svg>
    </button>
    <span class="np-marque">{{ title }}</span>
    <span
      class="np-utilisateur"
      aria-disabled="true"
      title="Connexion à venir"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span class="np-utilisateur__texte">Utilisateur</span>
    </span>
  </header>

  <nav
    id="np-navigation"
    class="np-nav"
    [class.np-nav--ouverte]="menuOuvert"
    aria-label="Navigation principale"
  >
    <a routerLink="/depots" (click)="fermerMenu()">Dépôts de linge</a>
  </nav>

  <main class="np-contenu">
    @if (estAccueil) {
      <section class="np-accueil">
        <h1>{{ title }}</h1>
        <p>Gestion des dépôts de linge et des tickets clients.</p>
        <a routerLink="/depots" class="np-bouton np-bouton--principal"
          >Voir les dépôts de linge</a
        >
      </section>
    }
    <router-outlet />
  </main>
</div>
