<div class="np-coquille" [class.np-coquille--publique]="!afficherNavigation">
  <header class="np-entete-application">
    @if (afficherNavigation) {
      <button
        type="button"
        class="np-menu-bascule"
        (click)="basculerMenu()"
        [attr.aria-expanded]="menuOuvert"
        aria-controls="np-navigation"
        aria-label="Menu de navigation"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
          focusable="false"
        >
          <line x1="4" y1="6" x2="20" y2="6"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="18" x2="20" y2="18"></line>
        </svg>
      </button>
    }
    <a routerLink="/" class="np-marque" (click)="fermerMenu()">{{ title }}</a>
    @if (auth.utilisateurCourant(); as utilisateur) {
      <div class="np-utilisateur">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="np-utilisateur__texte">{{ utilisateur.nom }} · {{ libelleRole() }}</span>
        <button type="button" class="np-deconnexion" (click)="deconnecter()">
          Déconnexion
        </button>
      </div>
    } @else {
      <a routerLink="/connexion" class="np-lien-connexion">Connexion</a>
    }
  </header>

  @if (afficherNavigation) {
    <nav
      id="np-navigation"
      class="np-nav"
      [class.np-nav--ouverte]="menuOuvert"
      aria-label="Navigation principale"
    >
      <a routerLink="/tableau-de-bord" (click)="fermerMenu()">Tableau de bord</a>
      <a routerLink="/depots" (click)="fermerMenu()">Dépôts de linge</a>
      <a routerLink="/notifications" (click)="fermerMenu()">Notifications</a>
      @if (auth.estGerant()) {
        <a routerLink="/tarifs" (click)="fermerMenu()">Tarifs</a>
        <a routerLink="/personnel" (click)="fermerMenu()">Personnel</a>
      }
    </nav>
  }

  <main class="np-contenu" [class.np-contenu--public]="pagePublique">
    <router-outlet />
  </main>
</div>
